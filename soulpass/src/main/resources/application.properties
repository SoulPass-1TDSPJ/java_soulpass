spring.application.name=soulpass

# Inclui a mensagem das ResponseStatusException no corpo dos erros da API
spring.web.error.include-message=always

# A Render informa a porta pela variável PORT; localmente usa 8080
server.port=${PORT:8080}

# A conexão com o Oracle é feita pelo ConnectionFactory, que lê as variáveis de ambiente
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD
